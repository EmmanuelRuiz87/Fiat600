<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control BLE — ESP32 Auto</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #131a24;
    --panel-border: #1f2b3a;
    --text: #e6edf3;
    --text-dim: #7d8a9c;
    --accent: #3ddc97;
    --accent-dim: #1f6b4c;
    --danger: #ff6b6b;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #142033 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }

  main{
    width:100%;
    max-width: 420px;
  }

  header{
    text-align:center;
    margin-bottom: 26px;
  }

  header h1{
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p{
    color: var(--text-dim);
    font-size: 0.92rem;
    margin: 0;
  }

  .estado{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }

  .punto{
    width:9px;
    height:9px;
    border-radius:50%;
    background: var(--danger);
    transition: background .2s ease, box-shadow .2s ease;
  }

  .punto.conectado{
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .btn-conectar{
    width:100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #06231a;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 24px;
    transition: transform .08s ease, background .2s ease;
  }
  .btn-conectar:active{ transform: scale(0.98); }
  .btn-conectar:disabled{
    background: var(--panel-border);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  .panel-servo{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 22px 18px 26px;
    margin-bottom: 20px;
  }

  .panel-servo h2{
    font-size: 0.78rem;
    text-transform: none;
    color: var(--text-dim);
    margin: 0 0 18px;
    font-weight: 600;
  }

  .controles-servo{
    display:flex;
    gap: 12px;
  }

  .btn-direccion{
    flex:1;
    padding: 24px 0;
    border-radius: 14px;
    border: 1px solid var(--panel-border);
    background: #0f1723;
    color: var(--text);
    font-size: 1.6rem;
    cursor: pointer;
    user-select:none;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .btn-direccion span.etiqueta{
    font-size: 0.72rem;
    color: var(--text-dim);
  }

  .btn-direccion:active{
    transform: scale(0.96);
    background: var(--accent-dim);
    border-color: var(--accent);
  }

  .btn-direccion:disabled{
    opacity: 0.35;
    cursor: not-allowed;
  }

  .consola{
    background: #090d13;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 14px;
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-dim);
    height: 130px;
    overflow-y: auto;
  }

  .consola p{ margin: 0 0 4px; line-height:1.4; }
  .consola p.ok{ color: var(--accent); }
  .consola p.err{ color: var(--danger); }

  .nota{
    text-align:center;
    color: var(--text-dim);
    font-size: 0.76rem;
    margin-top: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>Control del auto</h1>
    <p>Conexión BLE con el ESP32-C3</p>
  </header>

  <div class="estado">
    <div class="punto" id="punto"></div>
    <span id="textoEstado">Desconectado</span>
  </div>

  <button class="btn-conectar" id="btnConectar">Conectar con ESP32-Auto</button>

  <div class="panel-servo">
    <h2>Dirección (servo)</h2>
    <div class="controles-servo">
      <button class="btn-direccion" id="btnIzquierda" disabled>
        <span>◀</span>
        <span class="etiqueta">izquierda</span>
      </button>
      <button class="btn-direccion" id="btnDerecha" disabled>
        <span>▶</span>
        <span class="etiqueta">derecha</span>
      </button>
    </div>
  </div>

  <div class="panel-servo">
    <h2>Motor (avance)</h2>
    <div class="controles-servo">
      <button class="btn-direccion" id="btnAtras" disabled>
        <span>▼</span>
        <span class="etiqueta">atrás</span>
      </button>
      <button class="btn-direccion" id="btnAdelante" disabled>
        <span>▲</span>
        <span class="etiqueta">adelante</span>
      </button>
    </div>
  </div>

  <div class="consola" id="consola"></div>

  <p class="nota">
    Requiere Chrome o Edge (desktop o Android). Web Bluetooth no funciona en Safari/iPhone.
  </p>
</main>

<script>
  const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
  const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

  const btnConectar = document.getElementById('btnConectar');
  const btnIzquierda = document.getElementById('btnIzquierda');
  const btnDerecha = document.getElementById('btnDerecha');
  const btnAdelante = document.getElementById('btnAdelante');
  const btnAtras = document.getElementById('btnAtras');
  const punto = document.getElementById('punto');
  const textoEstado = document.getElementById('textoEstado');
  const consola = document.getElementById('consola');

  let characteristic = null;
  let device = null;

  function log(mensaje, tipo) {
    const p = document.createElement('p');
    p.textContent = mensaje;
    if (tipo) p.className = tipo;
    consola.appendChild(p);
    consola.scrollTop = consola.scrollHeight;
  }

  function setConectado(conectado) {
    punto.classList.toggle('conectado', conectado);
    textoEstado.textContent = conectado ? 'Conectado a ESP32-Auto' : 'Desconectado';
    btnIzquierda.disabled = !conectado;
    btnDerecha.disabled = !conectado;
    btnAdelante.disabled = !conectado;
    btnAtras.disabled = !conectado;
    btnConectar.textContent = conectado ? 'Desconectar' : 'Conectar con ESP32-Auto';
  }

  async function conectar() {
    if (!navigator.bluetooth) {
      log('Este navegador no soporta Web Bluetooth. Usá Chrome o Edge.', 'err');
      return;
    }

    try {
      log('Buscando dispositivo...');
      device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'ESP32-Auto' }],
        optionalServices: [SERVICE_UUID]
      });

      device.addEventListener('gattserverdisconnected', onDesconectado);

      log('Conectando...');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      setConectado(true);
      log('Conectado correctamente.', 'ok');
    } catch (error) {
      log('Error al conectar: ' + error.message, 'err');
    }
  }

  function desconectar() {
    if (device && device.gatt.connected) {
      device.gatt.disconnect();
    }
  }

  function onDesconectado() {
    setConectado(false);
    characteristic = null;
    log('Dispositivo desconectado.', 'err');
  }

  let enviando = false;      // evita mandar un comando mientras el anterior no terminó
  let intervaloActivo = null;

  async function enviarComando(comando) {
    if (!characteristic || enviando) return;
    enviando = true;
    try {
      const encoder = new TextEncoder();
      await characteristic.writeValue(encoder.encode(comando));
      log('Enviado: ' + comando, 'ok');
    } catch (error) {
      log('Error al enviar: ' + error.message, 'err');
    } finally {
      enviando = false;
    }
  }

  // Repite el envío del comando mientras el botón esté presionado.
  // REPETICION_MS controla qué tan seguido manda el comando: bajalo
  // para que gire más rápido/fluido, subilo si el ESP32 se satura.
  const REPETICION_MS = 150;

  function empezarEnvioContinuo(comando) {
    if (!characteristic) return;
    enviarComando(comando); // primer envío inmediato, sin esperar el intervalo
    detenerEnvioContinuo(); // por las dudas, limpia cualquier intervalo previo
    intervaloActivo = setInterval(() => enviarComando(comando), REPETICION_MS);
  }

  function detenerEnvioContinuo() {
    if (intervaloActivo) {
      clearInterval(intervaloActivo);
      intervaloActivo = null;
    }
  }

  // Engancha mouse (PC) y touch (celu) a un botón para que mande el
  // comando en bucle mientras esté presionado, y pare al soltar.
  // comandoAlSoltar es opcional: para el servo no hace falta (con dejar
  // de mandar "derecha"/"izquierda" ya se queda quieto), pero para el
  // motor hay que mandar "parar" explícitamente al soltar.
  function configurarBotonMantener(boton, comando, comandoAlSoltar) {
    function soltar() {
      detenerEnvioContinuo();
      if (comandoAlSoltar) enviarComando(comandoAlSoltar);
    }

    boton.addEventListener('mousedown', () => empezarEnvioContinuo(comando));
    boton.addEventListener('mouseup', soltar);
    boton.addEventListener('mouseleave', soltar); // si arrastra el mouse afuera del botón

    boton.addEventListener('touchstart', (e) => {
      e.preventDefault(); // evita que el celu dispare también un 'click' fantasma
      empezarEnvioContinuo(comando);
    });
    boton.addEventListener('touchend', soltar);
    boton.addEventListener('touchcancel', soltar);
  }

  btnConectar.addEventListener('click', () => {
    if (characteristic) {
      desconectar();
    } else {
      conectar();
    }
  });

  configurarBotonMantener(btnIzquierda, 'izquierda');
  configurarBotonMantener(btnDerecha, 'derecha');
  configurarBotonMantener(btnAdelante, 'adelante', 'parar');
  configurarBotonMantener(btnAtras, 'atras', 'parar');
</script>

</body>
</html>
